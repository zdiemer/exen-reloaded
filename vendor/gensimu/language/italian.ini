EXEN_STRING_23=- Da oggi puoi scaricare dei giochi sul tuo cellulare! Una volta scaricato, il gioco viene inserito nella lista “I miei giochi”. Possono essere presenti solo 2 giochi: Wall Breaker+1 gioco scaricato. - Il catalogo viene rinnovato periodicamente e si aggiorna automaticamente quando un gioco viene scaricato. Puoi scegliere di aggiornarlo manualmente. - Il costo dei giochi scaricati e degli SMS sono fatturati secondo le tariffe del tuo operatore, salvo particolari indicazioni. - Per giocare e navigare nel catalogo puoi utilizzare i tasti seguenti: ^ 2 < 4 5 ok 6 > v 8 # : Pausa - Per ulteriori informazioni, contatta il tuo Customer Service.
