EXEN_STRING_23=- Ce service vous permet de choisir des jeux dans un catalogue et de les télécharger dans votre mobile. Un jeu téléchargé remplacera le précédent. - Le catalogue est régulièrement renouvelé et sa mise à jour est automatique  lors du téléchargement d’un jeu. Vous pouvez  aussi choisir de déclencher la mise à jour manuellement. - Les téléchargements et les SMS sont facturés au tarif de votre opérateur, sauf indication spécifique. - Dans les jeux et dans le catalogue, les touches s’utilisent de la manière suivante : ^ 2 < 4 5 ok 6 > v 8 # : pause - Pour plus d’informations, contactez votre Service Client.
