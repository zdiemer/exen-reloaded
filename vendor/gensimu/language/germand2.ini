EXEN_STRING_23=* Mit Load-A-Game koennen Sie ein Spiel aus dem Spiele-Katalog auswaehlen und auf Ihr Handy downloaden. Das heruntergeladene Spiel ersetzt das vorherige. * Der Spiele-Katalog wird beim Download eines Spiels automatisch aktualisiert. Sie koennen die Aktualisierung auch manuell ausloesen. * Für den Download und die SMS gelten die Preise gemäß aktueller Vodafone-Preisliste. * Verwenden Sie in den Spielen und im Hauptmenue folgende Tasten : ^ 2 < 4 ok 5 6 > v 8 0 : abbrechen # : Pause * Weitere Informationen erhalten Sie unter www.vodafone.de.
