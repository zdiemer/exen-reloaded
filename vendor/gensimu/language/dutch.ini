EXEN_STRING_23=- Met deze service kunt u spelletjes selecteren in een catalogus en deze downloaden naar uw mobiele telefoon. Als u een nieuw spelletje downloadt vervangt dit het vorige spelletje. - De catalogus wordt regelmatig vernieuwd en wordt automatisch bijgewerkt als u een spelletje downloadt. U kunt echter ook kiezen voor handmatig bijwerken. - Gedownloade spelletjes en SMS’jes worden in rekening gebracht via uw telefoonrekening, tenzij anders aangegeven. - Bij de spelletjes en in de catalogus worden de toetsen als volgt gebruikt : ^ 2 < 4 5 ok 6 > v 8 # : pauze - Voor nadere informatie kunt u contact opnemen met uw Service Client.
