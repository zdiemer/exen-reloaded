EXEN_STRING_23=- Este serviço permite-lhe seleccionar os jogos através de um catálogo e transferi-los para o telemóvel. Um jogo transferido substitui o anterior. - O catálogo é actualizado regularmente. A actualização é automática quando transfere um jogo. Pode também actualizar um jogo manualmente. - As tarifas de transferência e SMS dependem do operador, excepto em indicação contrária. - No caso de jogos e do catálogo, as teclas são utilizadas do seguinte modo: ^ 2 < 4   5 ok   6 > v 8 # : pausa - Para mais informações, contacte o Serviço de Clientes.
