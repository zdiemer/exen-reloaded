EXEN_STRING_23=- Ueber diesen Service koennen Sie Spiele aus einem Verzeichnis auswaehlen und auf Ihr Handy herunterladen. Ein heruntergeladenes Spiel ersetzt das vorherige. - Das Verzeichnis wird regelmaessig überarbeitet und automatisch beim Download eines Spiels aktualisiert. Sie koennen die Aktualisierung auch manuell ausloesen. - Die Downloads und SMS werden zum Tarif Ihres Betreibers berechnet, ohne spezielle Angaben. - In den Spielen und im Verzeichnis verwendet man folgende Tasten : ^ 2 < 4 5 ok 6 > v 8 # : Pause - Weitere Informationen erhalten Sie bei unserem Kundenservice.
